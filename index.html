<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sợi chỉ đỏ của số phận — một câu chuyện tình yêu qua hạt bụi sáng"
    />
    <title>Sợi Chỉ Đỏ · Red Thread of Fate</title>
  </head>
  <body>
    <!-- Full-screen WebGL canvas -->
    <canvas id="canvas"></canvas>

    <!-- Scroll container — creates scrollable height; canvas stays fixed -->
    <div id="scroll-container"></div>

    <!-- UI overlay — section titles, scroll hint -->
    <div id="ui-overlay" aria-live="polite">
      <div id="section-label">
        <span id="section-number">01</span>
        <div id="section-titles">
          <h1 id="section-title">Khoảng Lặng Bình Yên</h1>
          <p id="section-subtitle">
            Bước đi một mình chưa bao giờ là nỗi cô đơn, mà là vùng trời bình
            yên em tự chọn...
          </p>
        </div>
      </div>

      <div id="scroll-hint">
        <div id="scroll-line"></div>
        <span>Cuộn xuống</span>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loader">
      <div id="loader-inner">
        <div id="loader-particles"></div>
        <p id="loader-text">Đang mở câu chuyện...</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
